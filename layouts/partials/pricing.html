{{ with .Site.Data.pricing}}
{{ if .enable}}
<section class="gallery" id="pricing">
  <div class="container">
        <div class="section-title">
          <h2>{{.title}}</h2>
           </div>
           {{ with .steps }}
           <div class="process-steps">
             {{ range . }}
             <figure class="process-step">
               <h3 class="process-step__title">{{ .title }}</h3>
               <a href="{{ .image | absURL }}" class="process-step__image" title="{{ .title }}" data-source="{{ .image | absURL }}">
                 <img src="{{ .image | absURL }}" alt="{{ .alt }}" loading="lazy" decoding="async">
               </a>
               <figcaption class="process-step__caption">{{ .caption }}</figcaption>
             </figure>
             {{ end }}
           </div>
           {{ end }}
           {{ partial "demo.html" $ }}

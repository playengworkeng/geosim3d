{{with .Site.Data.hero}}
{{if .enable}}
<section class="hero">

  <div class="hero-content" style="position:absolute;top:50%;left:50%; transform: translate(-50%, -50%);z-index: 5;">
    <div class="row align-items-center">
      <div class="col-lg-12">
        <h1>{{.title | safeHTML}}</h1>
        <p>
          {{.subtitle}}
        </p>
        {{ with .demoURL }}
        <div class="hero-demo">
          <a href="{{ . }}" class="btn-demo" data-demo-location="hero" target="_blank" rel="noopener">
            <span class="btn-demo__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </span>
            <span class="btn-demo__label">{{ $.Site.Data.hero.demoText | default "Try the Live Demo" }}</span>
          </a>
          {{ with $.Site.Data.hero.demoNote }}<small class="hero-demo__note">{{ . }}</small>{{ end }}
        </div>
        {{ end }}
      </div>
    </div>
  </div>
  <div>

    <video width="100%" height="100%" autoplay="true" loop="true" muted="true" playsinline="true" style="position:relative">
      <source src="videos/geosim_chicago_visualization.mp4">
    </video>
  </div>

</section>
{{end}}
{{end}}

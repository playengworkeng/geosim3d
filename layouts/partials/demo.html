{{/* Live demo strip: just the launch button. Used in pricing.html (Products); the "Demos" menu link points at #demo. */}}
{{ $url := site.Data.hero.demoURL }}
{{ with site.Data.demo }}
{{ if and .enable $url }}
<div class="demo-strip-wrap" id="demo">
<div class="demo-strip">
  <a href="{{ $url }}" class="btn-demo" target="_blank" rel="noopener">
    <span class="btn-demo__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </span>
    <span class="btn-demo__label">{{ .buttonText | default "Launch the Live Demo" }}</span>
  </a>
</div>
</div>
{{ end }}
{{ end }}

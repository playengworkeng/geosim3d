{{/* Live demo strip: screenshot + launch button. Used in pricing.html (Products). */}}
{{ $url := site.Data.hero.demoURL }}
{{ with site.Data.demo }}
{{ if and .enable $url }}
<div class="demo-strip" id="demo">
  <a href="{{ $url }}" class="demo-strip__preview" target="_blank" rel="noopener" aria-label="{{ .buttonText | default "Launch the Live Demo" }}">
    <img src="{{ .image | absURL }}" alt="{{ .imageAlt }}" width="1512" height="799" loading="lazy" decoding="async">
    <span class="demo-strip__play" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </span>
  </a>
  <a href="{{ $url }}" class="btn-demo" target="_blank" rel="noopener">
    <span class="btn-demo__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </span>
    <span class="btn-demo__label">{{ .buttonText | default "Launch the Live Demo" }}</span>
  </a>
</div>
{{ end }}
{{ end }}

{{define "main"}}
<script>
  // Count the lead only when the visitor actually submitted the contact form
  // (flag set by its onsubmit), so direct visits and refreshes don't count.
  (function(){
    var lead=false;
    try{ lead=sessionStorage.getItem('gs3d_lead')==='1'; sessionStorage.removeItem('gs3d_lead'); }catch(e){}
    if(!lead || typeof gtag!=='function') return;
    gtag('event','conversion',{'send_to':'AW-17202362045/NTISCM2E3OobEL3t3IpA'});
    gtag('event','generate_lead',{'form':'contact'});
  })();
</script>

<section class="thank-you-section" style="padding: 100px 0; text-align: center; background-color: #f9f9f9; font-family: sans-serif; min-height: 50vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 600px; margin: 0 auto; padding: 0 20px;">
    
    <!-- Success Icon Anchor -->
    <div style="font-size: 4rem; color: #2e7d32; margin-bottom: 20px;">✓</div>
    
    <!-- Clean, Outcome-focused Response Copy -->
    <h1 style="font-size: 2.5rem; color: #333; margin-bottom: 15px;">We've Received Your Request!</h1>
    
    <p style="font-size: 1.2rem; color: #666; line-height: 1.6; margin-bottom: 35px;">
      Thank you for reaching out. A 3D mapping specialist from the GeoSim3D team will review your project details and contact you within 1 business day.
    </p>
    
    <!-- Navigation Back to Safety -->
    <a href="/" style="display: inline-block; background-color: #333; color: white; text-decoration: none; padding: 14px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 4px; transition: background 0.2s;">
      Return to Homepage
    </a>
    
  </div>
</section>
{{end}}

# Services (layouts/partials/service.html): each card starts from something
# the live demo already does, then says what it becomes with a client's data.
# icon: one of switch | training | console | airport (inline SVGs in the partial).
enable: true
title: "From the Demo to Your Operation"
subtitle: >
          The rail yard demo runs on the same engine we use for client work.
          Here's what it becomes with your data.
demoLinkText: "Try the demo yourself"
services:
  - name: "Your Yard, in 3D"
    icon: "switch"
    demo: "A full yard with tracks, crossovers, and signal gantries."
    yours: >
              Your actual layout, switches, and equipment, built from your
              track plans, CAD drawings, and survey data.

  - name: "Switching & Crew Training"
    icon: "training"
    demo: "Select a train, route it through a switch, and watch it take the crossover."
    yours: >
              Switching moves, signal aspects, and route familiarization that crews
              can practice in a browser, without tying up real equipment.

  - name: "Live Yard Control"
    icon: "console"
    demo: "A Yard Control console tracking every train in the yard."
    yours: >
              Your GPS, AEI, or dispatch feeds connected, so the 3D yard shows
              where equipment really is, right now.

  - name: "Transit & Airports"
    icon: "airport"
    demo: "One rail yard, running live in your browser."
    yours: >
              The same engine for light rail corridors, transit depots, and airfields:
              routes, gates, and service vehicle flows.

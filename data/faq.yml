title: "Frequently Asked Questions"
faq:
  - question: "Can you build something like the demo for our yard?"
    answer: >
            Yes, that's the point of it. The demo runs on the same engine we use for
            client work; yours is built from your own layout, switches, and equipment,
            with the moves and views your team actually needs.
  - question: "Do you work with consultants and contractors?"
    answer: >
            Yes. We can work behind the scenes for engineering firms and operators,
            turning their project or client data into an interactive 3D model or video
            they can present under their own name. We work from CAD, track plans, GIS,
            or aerial imagery, and deliver a browser link, video, or stills.
  - question: "Do I need special computers or VR headsets to use this?"
    answer: >
            No. Like the demo, everything we build runs in a standard web browser on an
            ordinary laptop or desktop, with no extra software to install. Lighter
            versions can also run on tablets and phones.
  - question: "What files or data do I need to provide to get started?"
    answer: >
            Whatever you already have. Track plans, CAD drawings, airport layout plans,
            survey or lidar data, GIS layers, and aerial imagery all work, and a site
            location is enough to start from public map data. We take care of the data
            preparation and conversion.
  - question: "How long does it take to build a custom 3D digital replica?"
    answer: >
            It depends on the size and complexity of the site. A single yard, depot, or
            terminal area typically takes a few weeks; a full corridor or regional
            network takes longer. We give you a timeline once we've seen your data.
  - question: "Can we connect live data or tracking systems to our 3D model?"
    answer: >
            Yes. The trains in the demo are simulated, but in your model we can connect
            existing GPS, AEI, sensor, or dispatch feeds so vehicles and equipment move
            in 3D as they do on the ground.
  - question: "How are updates handled if our physical facility changes?"
    answer: >
            We don't build your model and walk away. As your layout, routes, or equipment
            change, we update your 3D environment to match.

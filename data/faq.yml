title: "Frequently Asked Questions"
faq:
  - question: "Do I need special computers or VR headsets to use this?"
    answer: >
            No. Every 3D model we build runs smoothly right inside a standard web 
            browser. You and your team can access your custom 3D environments 
            on any standard laptop, tablet, or smartphone without installing extra software.
  - question: "What files or data do I need to provide to get started?"
    answer: >
            We make this process completely hands-off for you. Depending on your project, 
            you can simply provide us with a physical address, drone footage, 2D blueprints, 
            or existing blueprint files. Our team handles 100% of the data preparation and conversion.
  - question: "How long does it take to build a custom 3D digital replica?"
    answer: >
            Timeline depends entirely on the size and complexity of your operation. 
            A single facility or real estate development can typically be completed in 
            a few weeks, while complex regional transit networks take longer. We provide a 
            clear timeline during our initial concept call.
  - question: "Can we connect live data or tracking systems to our 3D model?"
    answer: >
            Yes. We specialize in live operational command centers. We can integrate 
            your existing GPS trackers, sensor data, or facility inventory feeds directly 
            into your 3D model so you can watch your operations move in real time.
  - question: "How are updates handled if our physical facility changes?"
    answer: >
            Because we provide an end-to-end service, we don't just build your model and walk 
            away. We offer ongoing maintenance packages to seamlessly update your 3D 
            environment whenever your real-world layout, routes, or equipment change.
